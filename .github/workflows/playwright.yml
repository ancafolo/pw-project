name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Allure TestOps passes these when it triggers a run, so results land in the right launch
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "Allure TestOps job run ID (set by TestOps)"
        required: false
      ALLURE_USERNAME:
        description: "Allure TestOps username (set by TestOps)"
        required: false

env:
  ALLURE_ENDPOINT: https://demo.testops.cloud
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID || '5525' }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
  ALLURE_RESULTS: allure-results
  ALLURE_LAUNCH_NAME: "${{ github.workflow }} #${{ github.run_number }} (${{ github.ref_name }})"
  ALLURE_LAUNCH_TAGS: "github, playwright, ${{ github.ref_name }}"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install allurectl
      uses: allure-framework/setup-allurectl@v1
      with:
        allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
        allure-token: ${{ env.ALLURE_TOKEN }}
        allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

    - name: Run Playwright tests
      run: allurectl watch -- npx playwright test --project=e2e

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
