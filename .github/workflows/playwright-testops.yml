name: Playwright tests -> Allure TestOps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "Set by Allure TestOps when it triggers the run (leave empty for manual runs)"
        required: false
        default: ""
      ALLURE_USERNAME:
        description: "Set by Allure TestOps when it triggers the run (leave empty for manual runs)"
        required: false
        default: ""

env:
  ALLURE_ENDPOINT: https://demo.testops.cloud
  ALLURE_PROJECT_ID: 5525
  ALLURE_RESULTS: allure-results
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
  ALLURE_LAUNCH_NAME: "${{ github.workflow }} - #${{ github.run_number }}"
  ALLURE_LAUNCH_TAGS: "github-actions, playwright, ${{ github.ref_name }}"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run tests and upload results to Allure TestOps
        run: |
          rm -rf allure-results
          allurectl watch -- npx playwright test